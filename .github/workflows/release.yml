name: Release

# Pushing a vX.Y.Z tag publishes that version. Running the workflow by hand is a dry run: it builds
# the files and the notes and keeps them as an artifact, without publishing anything.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in a workflow that publishes, so a poisoned cache cannot reach a release.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm -r --workspace-concurrency=1 test
      - name: Package
        run: |
          echo "VERSION=$(node -p 'require("./apps/mcp/package.json").version')" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node scripts/package.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/package.mjs
          fi
      # The checksum table is computed from the files this job uploads; zips differ from build to build.
      - run: node scripts/release-notes.mjs "$VERSION" > release/notes.md
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Figloo $VERSION" --notes-file release/notes.md \
            "release/figloo-extension-$VERSION.zip" "release/figloo-mcp-$VERSION.mjs" "release/figloo-mcp-$VERSION.mcpb"
      - name: Keep the dry run's files
        if: github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          if-no-files-found: error
          path: |
            release/notes.md
            release/figloo-extension-${{ env.VERSION }}.zip
            release/figloo-mcp-${{ env.VERSION }}.mjs
            release/figloo-mcp-${{ env.VERSION }}.mcpb
