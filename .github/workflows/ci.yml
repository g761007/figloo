name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm version named by packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The other packages type-check and test against the built @figloo/protocol.
      - run: pnpm build
      - run: pnpm typecheck
      # One package at a time: several suites time WebSocket round trips and UI waits.
      - run: pnpm -r --workspace-concurrency=1 test
      # Catches a version bump that missed a file, and packaging that breaks on Linux.
      - run: node scripts/package.mjs
