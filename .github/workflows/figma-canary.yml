name: Figma canary

# Runs the integration tests against a public Figma file once a day, as a guest, so that a change in
# Figma's web UI shows up here before users run into it. Guests cannot select layers, so the
# inspection panel and exports are not covered. The logs are public and show layer names: the file
# behind FIGLOO_CANARY_FIGMA_URL must be one made for this test, never a real design. It needs at least
# two pages and, on the page the link opens, two same-named sibling layers with children.

on:
  schedule:
    - cron: "23 1 * * *" # 09:23 in Taipei
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: figma-canary

jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check that the canary file is set
        env:
          FIGLOO_E2E_FIGMA_URL: ${{ secrets.FIGLOO_CANARY_FIGMA_URL }}
        run: |
          if [ -z "$FIGLOO_E2E_FIGMA_URL" ]; then
            echo "::error::Set the repository secret FIGLOO_CANARY_FIGMA_URL to a Figma file made for this test that anyone with the link can view."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm version named by packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The full Chromium build, which loads extensions headlessly, and the libraries it needs on Linux.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:integration
        env:
          FIGLOO_E2E_FIGMA_URL: ${{ secrets.FIGLOO_CANARY_FIGMA_URL }}
